<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieMotions</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e2e2dd;
    --accent:#3b5bdb; --warm:#c2410c; --good:#15803d; --chip:#eef0f7;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1e1e23; --ink:#ecece8; --muted:#9a9a94; --line:#2e2e35;
    --accent:#8da2fb; --warm:#fb923c; --good:#4ade80; --chip:#26262e;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .meta{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  form{display:flex;gap:8px;margin-bottom:24px}
  input[type=text]{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
       background:var(--panel);color:var(--ink);font-size:15px}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{padding:11px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
       color:var(--ink);font-size:14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:13px 15px;margin-bottom:10px}
  .label{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;
         color:var(--muted);margin-bottom:8px}
  .human{border-left:3px solid var(--muted)}
  .call{border-left:3px solid var(--accent)}
  .result{border-left:3px solid var(--warm)}
  .ai{border-left:3px solid var(--good)}
  .args{font:12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-word}
  .args b{color:var(--ink);font-weight:600}
  .film{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;
        border-top:1px dashed var(--line)}
  .film:first-of-type{border-top:0}
  .film .t{font-weight:600}
  .film .s{font:12px ui-monospace,Menlo,monospace;color:var(--muted);text-align:right}
  .bar{grid-column:1/-1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .ev{grid-column:1/-1;font-size:13px;color:var(--muted);font-style:italic}
  .review{background:var(--panel);border:2px solid var(--warm);border-radius:11px;padding:15px}
  .review .draft{white-space:pre-wrap;margin:10px 0 14px;padding:11px;background:var(--chip);
        border-radius:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:8px;
        background:var(--bg);color:var(--ink);font:14px/1.5 inherit;margin-bottom:8px}
  .hidden{display:none}
  .answer{background:var(--panel);border:1px solid var(--good);border-left:3px solid var(--good);
        border-radius:11px;padding:15px;white-space:pre-wrap}
  .spin{color:var(--muted);font-size:14px}
  pre.raw{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MovieMotions</h1>
    <span class="meta" id="meta"></span>
  </header>

  <form id="askForm">
    <input type="text" id="q" autocomplete="off"
           placeholder="something tense with creatures, under two hours…">
    <button class="primary" id="go">Ask</button>
  </form>

  <div id="status" class="spin"></div>
  <div id="trace"></div>

  <div id="review" class="review hidden">
    <div class="label">review — nothing is sent until you decide</div>
    <div class="draft" id="draft"></div>
    <textarea id="note" class="hidden" placeholder="what is wrong with it?"></textarea>
    <div class="row">
      <button class="primary" data-act="approve">Approve</button>
      <button data-act="edit">Edit</button>
      <button data-act="revise">Send back</button>
    </div>
  </div>

  <div id="answer" class="answer hidden"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let thread = null;

fetch('/api/meta').then(r => r.json()).then(m => {
  $('#meta').textContent =
    `${m.model} · max ${m.max_passes} passes · tracing ${m.tracing ? 'on → ' + m.project : 'off'}`;
});

function esc(s){ return (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function drawTrace(steps){
  $('#trace').innerHTML = steps.map(s => {
    if (s.kind === 'human')
      return `<div class="step human"><div class="label">you</div>${esc(s.text)}</div>`;
    if (s.kind === 'tool_call'){
      const args = Object.entries(s.args)
        .map(([k,v]) => `<b>${esc(k)}</b>=${esc(JSON.stringify(v))}`).join('<br>');
      return `<div class="step call"><div class="label">chose tool · ${esc(s.tool)}</div>
              <div class="args">${args}</div></div>`;
    }
    if (s.kind === 'tool_result'){
      const body = s.films.length ? s.films.map(f => `
        <div class="film">
          <span class="t">${esc(f.title)} <span class="s">(${f.year}) · ${esc(f.runtime)}</span></span>
          <span class="s">${f.score.toFixed(3)} · ${esc(f.source)}</span>
          <span class="bar"><i style="width:${Math.min(100, f.score*100)}%"></i></span>
          ${f.evidence ? `<span class="ev">“${esc(f.evidence)}”</span>` : ''}
        </div>`).join('') : `<pre class="raw">${esc(s.text)}</pre>`;
      return `<div class="step result"><div class="label">tool returned</div>${body}</div>`;
    }
    return `<div class="step ai"><div class="label">model</div>${esc(s.text)}</div>`;
  }).join('');
}

function render(data){
  thread = data.thread_id;
  drawTrace(data.trace || []);
  $('#status').textContent = '';
  if (data.state === 'review'){
    $('#draft').textContent = data.draft;
    $('#review').classList.remove('hidden');
    $('#answer').classList.add('hidden');
  } else {
    $('#review').classList.add('hidden');
    $('#answer').textContent = data.answer;
    $('#answer').classList.remove('hidden');
    $('#go').disabled = false;
  }
}

async function post(url, body){
  $('#status').textContent = 'thinking…';
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify(body)});
  if (!r.ok){ $('#status').textContent = 'error ' + r.status; $('#go').disabled = false; return; }
  render(await r.json());
}

$('#askForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  $('#go').disabled = true;
  $('#answer').classList.add('hidden'); $('#review').classList.add('hidden');
  post('/api/ask', {question:q, thread_id: 'web-' + Date.now()});
});

$('#review').addEventListener('click', e => {
  const act = e.target.dataset.act; if (!act) return;
  const note = $('#note');
  if ((act === 'revise' || act === 'edit') && note.classList.contains('hidden')){
    note.classList.remove('hidden');
    note.placeholder = act === 'edit' ? 'your wording (replaces the draft)' : 'what is wrong with it?';
    note.focus(); note.dataset.act = act; return;          // first click reveals the box
  }
  const value = note.value.trim();
  note.classList.add('hidden'); note.value = '';
  post('/api/resume', {thread_id: thread, action: act,
                       text: act === 'edit' ? value : '', note: act === 'revise' ? value : ''});
});
</script>
</body>
</html>
